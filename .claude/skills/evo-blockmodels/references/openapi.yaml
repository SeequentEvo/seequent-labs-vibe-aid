    CreateData:
      properties:
        block_rotation:
          items:
            $ref: '#/components/schemas/Rotation'
          type: array
          maxItems: 3
          title: Block Rotation
          description: |

            The rotation of the block model. Defined by a list of clockwise rotations around given axes.

            The combined equation for the rotation is given by:

                R_1 ... R_n A = B

            where `A` is the location in the IJK space, `B` is the location in coordinate space, and `R_i` is the rotation matrix for the `i`th rotation.

            For example, if the first rotation is a rotation of 15 degrees clockwise around the X axis, `R_1` would be `[[1, 0, 0], [0, cos(15), sin(15)], [0, -sin(15), cos(15)]]`.

            Two rotations around the same axis cannot be consecutive items within the list of rotations.
        comment:
          anyOf:
            - type: string
              maxLength: 250
            - type: 'null'
          title: Comment
        coordinate_reference_system:
          anyOf:
            - type: string
              maxLength: 10000
            - type: 'null'
          title: Coordinate Reference System
          description: |

            Coordinate reference system used in the block model.

            This may be an EPSG code, signified by the prefix 'EPSG:', or a coordinate system definition in WKT format.
            If an EPSG code is provided, it must be for a coordinate reference system with a length unit type (e.g. `metre`, or `foot`).
          examples:
            - EPSG:3395
        description:
          anyOf:
            - type: string
              maxLength: 500
            - type: 'null'
          title: Description
          description: Description of the block model
        fill_subblocks:
          type: boolean
          title: Fill Subblocks
          description: |

            Sets the default fill_subblocks value for this block model. It can be overridden at the time of an update.
            If this flag is `true`, then updates to a fully subblocked-model with `update_type`=`merge`, and `geometry_change`=`true`
            with missing sub-blocks will fill the missing sub-blocks with data from the parent block.
          default: false
        lineage:
          anyOf:
            - $ref: '#/components/schemas/Lineage_V1_0_0'
            - type: 'null'
          description: Lineage of the block model
          deprecated: true
        model_origin:
          $ref: '#/components/schemas/Location'
        name:
          type: string
          maxLength: 100
          minLength: 3
          title: Name
          description: Name of the block model. This may not contain `/` nor `\`. Leading and trailing whitespace will be automatically removed.
        object_path:
          anyOf:
            - type: string
            - type: 'null'
          title: Object Path
          description: |

            Path of the folder in Geoscience Object Service to create the reference object in.

            This may not contain relative elements like `.` or `..`. It may not contain double slashes `//`, nor backslashes `\`,
            nor elements ending in `.`.
          examples:
            - /path/to/folder
        size_options:
          oneOf:
            - $ref: '#/components/schemas/SizeOptionsRegular'
            - $ref: '#/components/schemas/SizeOptionsOctree'
            - $ref: '#/components/schemas/SizeOptionsFullySubBlocked'
            - $ref: '#/components/schemas/SizeOptionsFlexible'
          title: Size Options
          discriminator:
            propertyName: model_type
            mapping:
              flexible: '#/components/schemas/SizeOptionsFlexible'
              fully-sub-blocked: '#/components/schemas/SizeOptionsFullySubBlocked'
              regular: '#/components/schemas/SizeOptionsRegular'
              variable-octree: '#/components/schemas/SizeOptionsOctree'
        size_unit_id:
          anyOf:
            - type: string
            - type: 'null'
          title: Size Unit Id
          description: Unit ID denoting the length unit used for the block model's blocks.
          examples:
            - m
      additionalProperties: false
      type: object
      required:
        - block_rotation
        - model_origin
        - name
        - size_options
      title: CreateData
    CreateReportNegativeValuesPolicy:
