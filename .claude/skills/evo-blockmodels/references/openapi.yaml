components:
  schemas:
    AuthenticationErrorResponse:
      properties:
        detail:
          type: string
          title: Detail
          description: A human-readable explanation specific to this occurrence of the problem.
          examples:
            - Invalid authentication credentials
        status:
          type: integer
          title: Status
          description: The HTTP status code generated by the origin server for this occurrence of the problem.
          examples:
            - 401
        title:
          type: string
          title: Title
          description: A short, human-readable summary of the problem type.
          examples:
            - Invalid authentication credentials
        type:
          type: string
          title: Type
          description: A URI reference that is the primary identifier of the problem type.
          examples:
            - https://seequent.com/error-codes/block-model-service/auth/unauthorized
      type: object
      required:
        - detail
        - status
        - title
        - type
      title: AuthenticationErrorResponse
    AuthorizationErrorResponse:
      properties:
        detail:
          type: string
          title: Detail
          description: A human-readable explanation specific to this occurrence of the problem.
          examples:
            - Permission denied
        status:
          type: integer
          title: Status
          description: The HTTP status code generated by the origin server for this occurrence of the problem.
          examples:
            - 403
        title:
          type: string
          title: Title
          description: A short, human-readable summary of the problem type.
          examples:
            - Permission Denied
        type:
          type: string
          title: Type
          description: A URI reference that is the primary identifier of the problem type.
          examples:
            - https://seequent.com/error-codes/block-model-service/auth/forbidden
      type: object
      required:
        - detail
        - status
        - title
        - type
      title: AuthorizationErrorResponse
    BBox:
      properties:
        i_minmax:
          $ref: '#/components/schemas/IntRange'
          description: Minimum and maximum values for the `i` column in the file
        j_minmax:
          $ref: '#/components/schemas/IntRange'
          description: Minimum and maximum values for the `j` column in the file
        k_minmax:
          $ref: '#/components/schemas/IntRange'
          description: Minimum and maximum values for the `k` column in the file
      additionalProperties: false
      type: object
      required:
        - i_minmax
        - j_minmax
        - k_minmax
      title: BBox
    BBoxXYZ:
      properties:
        x_minmax:
          $ref: '#/components/schemas/FloatRange'
          description: Minimum and maximum values for the `x` column in the file
        y_minmax:
          $ref: '#/components/schemas/FloatRange'
          description: Minimum and maximum values for the `y` column in the file
        z_minmax:
          $ref: '#/components/schemas/FloatRange'
          description: Minimum and maximum values for the `z` column in the file
      additionalProperties: false
      type: object
      required:
        - x_minmax
        - y_minmax
        - z_minmax
      title: BBoxXYZ
    BlockModel:
      properties:
        bbox:
          $ref: '#/components/schemas/BBoxXYZ'
          description: |

            Axis-aligned bounding box of the block model.

            This is the smallest box that fully contains all blocks within the block model, regardless of whether they contain data.
            It is defined by the minimum and maximum coordinates along each axis.
          readOnly: true
        block_rotation:
          items:
            $ref: '#/components/schemas/Rotation'
          type: array
          title: Block Rotation
          description: |

            The rotation of the block model. Defined by a list of clockwise rotations around given axes.

            The combined equation for the rotation is given by:

                R_1 ... R_n A = B

            where `A` is the location in the IJK space, `B` is the location in coordinate space, and `R_i` is the rotation matrix for the `i`th rotation.

            For example, if the first rotation is a rotation of 15 degrees clockwise around the X axis, `R_1` would be `[[1, 0, 0], [0, cos(15), sin(15)], [0, -sin(15), cos(15)]]`.

            Two rotations around the same axis cannot be consecutive items within the list of rotations.
        bm_uuid:
          type: string
          format: uuid
          title: Block model ID
          description: ID of the block model
        coordinate_reference_system:
          anyOf:
            - type: string
            - type: 'null'
          title: Coordinate Reference System
          description: |

            Coordinate reference system used in the block model.

            This may be an EPSG code, signified by the prefix 'EPSG:', or a coordinate system definition in WKT format.
            If an EPSG code is provided, it must be for a coordinate reference system with a length unit type (e.g. `metre`, or `foot`).
          examples:
            - EPSG:3395
        created_at:
          type: string
          format: date-time
          title: Created At
          description: Block model creation time
        created_by:
          $ref: '#/components/schemas/IMSUserInfo'
          description: User who created the block model
        description:
          anyOf:
            - type: string
            - type: 'null'
          title: Description
          description: User-supplied description of the block model
        fill_subblocks:
          type: boolean
          title: Fill Subblocks
          description: Indicates that updates for this block model should default to filling sub-blocks
          default: false
        geoscience_object_id:
          anyOf:
            - type: string
              format: uuid
            - type: 'null'
          title: Geoscience Object Id
          description: UUID of the Geoscience Object Service object associated with the block model
          examples:
            - f1230d69-c779-4736-9eb6-f82d49aafa9a
        last_updated_at:
          type: string
          format: date-time
          title: Last Updated At
          description: Date and time of the last block model update, including metadata updates
        last_updated_by:
          $ref: '#/components/schemas/IMSUserInfo'
          description: User who last updated the block model, including metadata updates
        model_origin:
          $ref: '#/components/schemas/Location'
          description: Origin of the block model
        name:
          type: string
          title: Name
          description: The human-readable label used to identify the block model
        normalized_rotation:
          prefixItems:
            - type: number
            - type: number
            - type: number
          type: array
          maxItems: 3
          minItems: 3
          title: Normalized Rotation
          description: Normalised rotation of the block model, represented as intrinsic rotations around the Z axis, then X axis, then Z axis.
        org_uuid:
          type: string
          format: uuid
          title: Organisation ID
          description: Organisation the block model belongs to.
          examples:
            - e6230d69-c779-4736-9eb6-f82d49aafa06
        size_options:
          oneOf:
            - $ref: '#/components/schemas/SizeOptionsRegular'
            - $ref: '#/components/schemas/SizeOptionsOctree'
            - $ref: '#/components/schemas/SizeOptionsFullySubBlocked'
            - $ref: '#/components/schemas/SizeOptionsFlexible'
          title: Size Options
          description: Size of the block model
          discriminator:
            propertyName: model_type
            mapping:
              flexible: '#/components/schemas/SizeOptionsFlexible'
              fully-sub-blocked: '#/components/schemas/SizeOptionsFullySubBlocked'
              regular: '#/components/schemas/SizeOptionsRegular'
              variable-octree: '#/components/schemas/SizeOptionsOctree'
        size_unit_id:
          anyOf:
            - type: string
            - type: 'null'
          title: Size Unit Id
          description: Unit ID denoting the length unit used for the block model's blocks.
        workspace_id:
          type: string
          format: uuid
          title: Workspace ID
          description: Workspace the block model belongs to.
          examples:
            - 860be2f5-fe06-4c1b-ac8b-7d34d2b6d2ef
      additionalProperties: false
      type: object
      required:
        - bbox
        - block_rotation
        - bm_uuid
        - created_at
        - created_by
        - last_updated_at
        - last_updated_by
        - model_origin
        - name
        - normalized_rotation
        - org_uuid
        - size_options
        - workspace_id
      title: BlockModel
