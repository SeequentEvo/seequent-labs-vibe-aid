        name:
          type: string
          maxLength: 120
          title: Name
          description: The human-readable label used to identify the report
        negative_values_policy:
          $ref: '#/components/schemas/CreateReportNegativeValuesPolicy'
          description: Policy for handling negative values in the report's cut-off or value columns. `IGNORE_BLOCK` is deprecated and cannot be used when creating a new Report Specification
          default: MARK_AS_INVALID
          examples:
            - USE
        null_values_policy:
          $ref: '#/components/schemas/CreateReportNullValuesPolicy'
          description: Policy for handling null values in the report's cut-off or value columns. `IGNORE_BLOCK` is deprecated and cannot be used when creating a new Report Specification
          default: MARK_AS_INVALID
          examples:
            - ZERO
        volume_filter_options:
          anyOf:
            - $ref: '#/components/schemas/VolumeFilterOptions-Input'
            - type: 'null'
          description: Volume filter options for this report
          x-api-preview: true
