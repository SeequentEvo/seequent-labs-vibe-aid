openapi: 3.1.0
info:
  title: Block Model API
  description: |2-

        The Block Model API provides the ability to manage and report on block models in your Evo workspaces. Enable your
        product with Evo connected workflows by integrating with the Seequent Block Model API.
        
        The Block Model API supports a range of sub-blocking options, and both full and partial updates to block models,
        including updates of specified columns and/or sub-volumes. Block models are versioned, and the service supports
        reporting on the material content of current or previous versions, and comparing the content between versions of
        a block model.
        
        For more information on the Block Model API, see [Overview](/docs/guides/blockmodel/), or the API references here.
        
  version: 1.42.9
tags:
  - name: Operations
    description: Operations on block model metadata
  - name: Metadata
    description: Endpoints that retrieve block model metadata
  - name: Versions
    description: Endpoints that retrieve information about versions of a block model
  - name: Column operations
    description: Operations that modify the columns/blocks within a block model
  - name: Jobs
    description: Get information about a job
  - name: Units
    description: Endpoints for describing and managing Units
  - name: Reports
    description: Endpoints for reporting against block models
paths:
  /blockmodel/orgs/{org_id}/workspaces/{workspace_id}/block-models:
    post:
      tags:
        - Operations
      summary: Create a block model
      description: |-
        This endpoint is where you define the model type, size, origin point, and rotation to register the block model and create the initial version, which will contain the block model default columns:

        - For regular models: `i`, `j`, `k`, `x`, `y`, `z`, `version_id`

        - For fully sub-blocked and octree models: `i`, `j`, `k`, `sidx`, `x`, `y`, `z`, `dx`, `dy`, `dz`, `version_id`

        - For flexible models: `i`, `j`, `k`, `start_si`, `start_sj`, `start_sk`, `end_si`, `end_sj`, `end_sk`, `x`, `y`, `z`, `dx`, `dy`, `dz`, `version_id`

        On a successful request, the server will respond with the details outlined in the `BlockModelAndJobUrl` object. The status of this job can be polled via a GET request to the `job_url`.

        A minimum workspace role of Editor is required to use this endpoint.
      operationId: create_block_model
      security:
        - HTTPBearer: []
      parameters:
        - name: workspace_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            title: Workspace ID
            description: ID of the workspace this call is scoped to. Represented as a v4 UUID.
            examples:
              - 860be2f5-fe06-4c1b-ac8b-7d34d2b6d2ef
            pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
          description: ID of the workspace this call is scoped to. Represented as a v4 UUID.
        - name: org_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            title: Organization ID
            description: ID of the organization this call is scoped to. Represented as a v4 UUID.
            examples:
              - bf1a040c-8c58-4bc2-bec2-c5ae7de8bd84
            pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
          description: ID of the organization this call is scoped to. Represented as a v4 UUID.
        - name: Authorization
          in: header
          required: true
          schema:
            type: string
            title: Authorization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateData'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BlockModelAndJobURL'
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationErrorResponse'
          description: Unauthorized
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorizationErrorResponse'
          description: Forbidden
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundExceptionResponse'
          description: Not Found
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NameConflictErrorResponse'
          description: Conflict
        '410':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoneExceptionResponse'
          description: Gone
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
          description: Unprocessable Content
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceErrorResponse'
          description: Internal Server Error
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceUnavailableErrorResponse'
          description: Service Unavailable
    get:
      tags:
        - Metadata
      summary: List all block models in a workspace
      description: |-
        Gets a paginated list of all block models in a workspace identified by `workspace_id`. By retrieving this list, you can
        obtain the `bm_id` value for a given model, which can then be used in
        subsequent API requests to upload or download data, along with performing other operations.

        The list is ordered from the most recently updated block model to the least recently updated block model.
        By default, the list is ordered from the most recently updated block model to the least recently updated block model.
        If a `sort` query parameter is specified, the list will be ordered according to the specified field.

        This endpoint is paginated, therefore by default this lists at most the first 50 block models. To get other block
        models, use the `offset` and `limit` query parameters to select the desired part of the list.
        An `offset` beyond the total number of block models in the workspace will result in an empty `results` list.
        The `limit` must be an integer from 1 to 100.
        The response includes `total`, which is the total number of block models within the list.

        All workspace roles can use this endpoint.
      operationId: list_block_models
      security:
        - HTTPBearer: []
      parameters:
        - name: workspace_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            title: Workspace ID
            description: ID of the workspace this call is scoped to. Represented as a v4 UUID.
            examples:
              - 860be2f5-fe06-4c1b-ac8b-7d34d2b6d2ef
            pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
          description: ID of the workspace this call is scoped to. Represented as a v4 UUID.
        - name: org_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            title: Organization ID
            description: ID of the organization this call is scoped to. Represented as a v4 UUID.
            examples:
              - bf1a040c-8c58-4bc2-bec2-c5ae7de8bd84
            pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
          description: ID of the organization this call is scoped to. Represented as a v4 UUID.
        - name: deleted
          in: query
          required: false
          schema:
            type: boolean
            description: |

              An optional boolean parameter specifying whether to list only deleted block models.

              - If set to `true`, the response will only list block models that were deleted via the 'Delete a block model' endpoint. This list will not include block models that are within deleted workspaces.

              - By default, or if set to `false`, the response will only list non-deleted block models within non-deleted workspaces.
            default: false
            title: Deleted
          description: |

            An optional boolean parameter specifying whether to list only deleted block models.

            - If set to `true`, the response will only list block models that were deleted via the 'Delete a block model' endpoint. This list will not include block models that are within deleted workspaces.

            - By default, or if set to `false`, the response will only list non-deleted block models within non-deleted workspaces.
        - name: order_by
          in: query
          required: false
          schema:
            type: string
            description: |

              An optional query parameter specifying how the results should be sorted. If not provided, results are sorted by `last_updated_at` in descending order.

              This is a comma-separated list of fields; allowed field names are `name`, `created_at`, and `last_updated_at`.
              You cannot specify the same field twice.

              By default, results are sorted in ascending order.
              To explicitly specify the sort order for a field, you can prefix its name with `asc:` (ascending) or `desc:` (descending).
              For example, `order_by=desc:created_at` will sort block models by time created in descending order.
            title: Order By
          description: |

            An optional query parameter specifying how the results should be sorted. If not provided, results are sorted by `last_updated_at` in descending order.

            This is a comma-separated list of fields; allowed field names are `name`, `created_at`, and `last_updated_at`.
            You cannot specify the same field twice.

            By default, results are sorted in ascending order.
            To explicitly specify the sort order for a field, you can prefix its name with `asc:` (ascending) or `desc:` (descending).
            For example, `order_by=desc:created_at` will sort block models by time created in descending order.
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            maximum: 2147483647
            minimum: 0
            description: Index of the first item to return.
            default: 0
            title: Offset
          description: Index of the first item to return.
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            maximum: 100
            exclusiveMinimum: 0
            description: Maximum number of items to return from the list. Must be greater than 0 and less than or equal to 100.
            default: 50
            title: Limit
          description: Maximum number of items to return from the list. Must be greater than 0 and less than or equal to 100.
        - name: Authorization
          in: header
          required: true
          schema:
            type: string
            title: Authorization
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedResponse_BlockModel_'
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationErrorResponse'
          description: Unauthorized
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorizationErrorResponse'
          description: Forbidden
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundExceptionResponse'
          description: Not Found
        '410':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoneExceptionResponse'
          description: Gone
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
          description: Unprocessable Content
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceErrorResponse'
          description: Internal Server Error
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceUnavailableErrorResponse'
          description: Service Unavailable
  /blockmodel/orgs/{org_id}/workspaces/{workspace_id}/block-models/{bm_id}/blocks:
    post:
      tags:
        - Versions
      summary: Start a block model data query
      description: |-
        Starts a query job against the block model identified by `bm_id`. This will produce a file that
        contains block model data for selected columns, and within the bounding box if provided.

        This request will respond with a reflection of the query criteria, as well as a pollable `job_url`. The `job_url` should
        be polled with a GET request to wait for the `job_status` field of the job to become either `FAILED` or `COMPLETE`. When
        the `job_status` becomes `COMPLETE`, the response will look like this:

        ```
        {
            "job_status": "COMPLETE",
            "payload": {
                "download_url": "<download url>"
            }
        }
        ```

        The `download_url` points to the output file of the query job, and can be downloaded using a GET request.
        The download URL that is generated every time the completed `job_url` is
        polled has a 30 minute time-to-live (TTL), so the download process must be started within 30 minutes. The download
         itself can take longer than 30 minutes, as long as the connection remains open.

        The downloaded file will either be an Apache Parquet file or a CSV file, depending on the value specified in the
        `file_format` field under `output_options`. The columns included within the file depend on the type of sub-blocking and
        the values specified in the `geometry_columns` and `columns` fields. The `geometry_columns` field determines whether
        the blocks within the output file are primarily identified by their coordinates or by their block indices.

        If `geometry_columns` is set to "indices" (the default), then the first columns in the output file will be `i`, `j`, `k` followed by the sub-block index columns (if applicable).
        If `geometry_columns` is set to "coordinates", then the output file will contain the columns `x`, `y`, `z` for regular block models and `x`, `y`, `z`, `dx`, `dy`, `dz` for sub-blocked block models. These columns are referred to as the "geometry" columns.

        The remaining columns within the output file are determined by the `columns` field. The `columns` field supports
        selecting columns by either their title or ID, and can also include a wildcard (`"*"`) placeholder, which will expand to
        all user columns, ordered alphabetically by title, in a case-insensitive manner. Please note that the wildcard does not
        cover the system column `version_id` and `sub_block_derivation`. To include `version_id` and `sub_block_derivation` in the output file, they
        must also be explicitly specified in the `columns` field alongside the wildcard. The order of columns in the output file
        will match the order in the `columns` field. Columns that are part of the initial "geometry" columns will be ignored if specified.

        The `sub_block_derivation` column indicates the source of the block values with one of the following statuses:
        - `"user specified"`: Column values come directly from uploaded file, or the block has no data available.
        - `"derived from parent"`: Column values were calculated entirely by the system based on parent block values, with no corresponding data in the original uploaded file.
        - `"some columns derived"`: Column values are a mix of original data and system-calculated values.

        Examples:
        Given a model has the following user columns: `A`(with a column ID of `d718abe4-56a5-4e27-ad51-813e69eb8aac`), `B`, and
        `C`. The table below shows the output file columns for different model types and parameters:

        | Model Type | `geometry_columns` field | `columns` field | Output File Columns |
        |------------|--------------------------|-----------------|---------------------|
        | Regular           | "indices"         | `["d718abe4-56a5-4e27-ad51-813e69eb8aac", "B"]`        | `i`, `j`, `k`, `A`, `B` |
        | Regular           | "coordinates"     | `[]`                | `x`, `y`, `z` |
        | Fully sub-blocked | "indices"         | `["*"]`             | `i`, `j`, `k`, `sidx`, `A`, `B`, `C` |
        | Flexible          | "coordinates"     | `["*", "start_si"]` | `x`, `y`, `z`, `dx`, `dy`, `dz`, `A`, `B`, `C`, `start_si` |


        The column headers (header row values in CSV files and schema field names in Parquet files) will either be the name of
        the columns or the column ID, depending on the value specified in the `column_headers` field.

        Example: for a fully sub-blocked model with a `columns` field:
        `["col_1", "dx", "x", "z", "d635868c-24ae-4ebe-9358-acb433b3c8cb"]` (where `d635868c-24ae-4ebe-9358-acb433b3c8cb` is the
        column ID of `col_2`) and `column_headers`: `name`, the output file will contain the following columns in order:
        [`i`, `j`, `k`, `sidx`, `col_1`, `dx`, `x`, `z`, `col_2`].

        For CSV files, the delimiter that separate values in the output file can also be configured using the `delimiter`
        field.

        For Parquet files, the output file will have the following characteristics:
        - Row group size of 100,000
        - Compressed using Zstd
        - Parquet data page version set to 1.0 and Parquet version set to 2.6

        This request may be cached, so the `job_url` may point to an already completed job.

        All workspace roles can use this endpoint.
      operationId: query_block_model_latest_as_post
      security:
        - HTTPBearer: []
      parameters:
        - name: bm_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            title: Block model ID
            description: ID of the block model this call is scoped to. Represented as a v4 UUID.
            examples:
              - e3c277c2-edc6-4a7a-8380-251dd19231f2
            pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
          description: ID of the block model this call is scoped to. Represented as a v4 UUID.
        - name: workspace_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            title: Workspace ID
            description: ID of the workspace this call is scoped to. Represented as a v4 UUID.
            examples:
              - 860be2f5-fe06-4c1b-ac8b-7d34d2b6d2ef
            pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
          description: ID of the workspace this call is scoped to. Represented as a v4 UUID.
        - name: org_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            title: Organization ID
            description: ID of the organization this call is scoped to. Represented as a v4 UUID.
            examples:
              - bf1a040c-8c58-4bc2-bec2-c5ae7de8bd84
            pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
          description: ID of the organization this call is scoped to. Represented as a v4 UUID.
        - name: Authorization
          in: header
          required: true
          schema:
            type: string
            title: Authorization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QueryCriteria'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueryResult'
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationErrorResponse'
          description: Unauthorized
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorizationErrorResponse'
          description: Forbidden
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundExceptionResponse'
          description: Not Found
        '410':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoneExceptionResponse'
          description: Gone
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueryErrorResponse'
          description: Unprocessable Content
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceErrorResponse'
          description: Internal Server Error
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceUnavailableErrorResponse'
          description: Service Unavailable
    patch:
      tags:
        - Column operations
      summary: Start a block model data update
      description: |-
        Starts the workflow to update the latest version of the block model. On workflow success, a new version of the block model will be created that will contain the changes specified in the request.

        When a user wishes to update the blocks of a block model, they need to hit multiple endpoints to complete the workflow. This includes:

        1. An initial request;
        2. An upload of data (for `new` and `update` operations);
        3. And finally, a confirmation that the update job can proceed from the state `PENDING_UPLOAD` to `QUEUED`.

        This endpoint is the initial request, where the server does a sanity check/validation on what the client is attempting to do.

        With regards to the request body,
        - We require the `columns` field to be supplied, which is used to convey which operations the client wishes the service to perform on the block model during the update. The sub-fields of columns (or operations) `new`, `update`, `rename`, `update_metadata`, and `delete` specify the downstream behaviour on the specified columns during the update workflow. Note that `new`, `update`, and `delete` can be provided in concert, whilst `rename` can only be provided by itself. `update_metadata` can be provided along with `new`, `update`, and `delete`, but only when there are no columns being renamed (i.e. when only the unit ID is being updated). Some general rules/mechanics for all of these fields:
            - The reserved system columns [`i`, `j`, `k`, `sidx`, `x`, `y`, `z`, `dx`, `dy`, `dz`, `version_id`] and any other model type specific sub-block index columns, cannot be targeted using any of the update operations.
                - Note for Datamine file imports, this restriction extends to the fields `[IJK, XC, YC, ZC, XINC, YINC, ZINC]`. These will be mapped automatically from the file to their BMS equivalents.
            - Any list of titles provided cannot contain duplicates.
            - In all cases, unless specifically stated otherwise, columns that are targeted in one operation cannot be targeted in another.
        - There is an optional field `update_type`, which is used to determine which blocks are updated in the block model. The supported update types are `replace` and `merge`.
            - If `update_type` is set to `replace`, the values of the columns provided in the update file are updated for all blocks within the block model. If a block is not provided in the update file, the column values for that block are set to `null`. The columns not provided in the update file are not affected.
            - If `update_type` is set to `merge` (the default), only the blocks and columns that are provided in the update file are updated. The blocks and columns not provided in the update file are not affected.
        - Note that the optional field `geometry_change` can only be set to `true` for sub-blocked models.
            - If `geometry_change` is omitted, `null`, or set to `false`, no new sub-blocks can be created nor destroyed, only sub-blocks that exist in the latest version can be updated. `null` and `false` are treated identically, for all model types.
            - If `geometry_change` is set to `true`, new sub-blocks can be created and/or existing sub-blocks can be destroyed, but all columns must be provided. If `update_type` is set to `merge`, then all sub-blocks within a parent block must be provided.
        - For `new` and `update` operations, the details of the data file for upload can be specified using the optional `input_options` field.

        If the request is successful, the server then sends back a pollable `job_url` and an `upload_url` (if required). The `upload_url` is where the data associated with a `new` or `update` operation should be uploaded to, which can be done with a PUT request. Note that the generated URL contains a SAS token, which is used to authenticate the upload. An upload can be started no later than 30 minutes after the generation of the SAS token.

        With regards to the data file to be uploaded,
        - The file can either be in Parquet, CSV, or Datamine (.dm) format.
        - The file needs to contain either IJK (block index) or XYZ (centroid coordinate) information for each block/row, along with the data for the columns specified in the request body, using the correct data type.
        - If both IJK and XYZ columns are supplied in the data file, the service will only make use of the IJK information.
            - Datamine is an exception to this rule - for these files, BlockSync only uses the XYZ information and ignores the IJK field.
        - The file must include the required system columns, which vary depending on the block model type:
            - Regular models: Require `i`, `j`, `k` (block indices) or `x`, `y`, `z` (centroid coordinates).
            - Fully sub-blocked models: Require `i`, `j`, `k`, `sidx` (sub-block index) or `x`, `y`, `z`, `dx`, `dy`, `dz` (sub-block sizes along each axis).
            - Octree models: Requirements are the same as fully sub-blocked models.
            - Flexible models: Require `i`, `j`, `k`, `start_si`, `start_sj`, `start_sk`, `end_si`, `end_sj`, `end_sk` (sub-block grid indices) or `x`, `y`, `z`, `dx`, `dy`, `dz`.
        - Reserved system columns must use the correct data types:
            - Indices `i`, `j`, `k`, and `sidx` must be `UInt32`.
            - Coordinates `x`, `y`, `z`, `dx`, `dy`, and `dz` must be `Float64`.
            - Sub-block grid indices `start_si`, `start_sj`, `start_sk`, `end_si`, `end_sj`, `end_sk` must be `UInt8`.

        A minimum workspace role of Editor is required to use this endpoint.
      operationId: update_block_model_from_latest_version
      security:
        - HTTPBearer: []
      parameters:
        - name: workspace_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            title: Workspace ID
            description: ID of the workspace this call is scoped to. Represented as a v4 UUID.
            examples:
              - 860be2f5-fe06-4c1b-ac8b-7d34d2b6d2ef
            pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
          description: ID of the workspace this call is scoped to. Represented as a v4 UUID.
        - name: org_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            title: Organization ID
            description: ID of the organization this call is scoped to. Represented as a v4 UUID.
            examples:
              - bf1a040c-8c58-4bc2-bec2-c5ae7de8bd84
            pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
          description: ID of the organization this call is scoped to. Represented as a v4 UUID.
        - name: bm_id
