    QueryCriteria:
      properties:
        bbox:
          anyOf:
            - oneOf:
                - $ref: '#/components/schemas/BBox'
                - $ref: '#/components/schemas/BBoxXYZ'
            - type: 'null'
          title: Bbox
          description: |+

            Bounding box of the search area as integer indexes or model aligned coordinates. If not provided, this is set to the entire block model.
                If using integer indexes, they must be `>=` zero and `<=` the number of blocks - 1.
                For example, if a block model has:
                ```
                n_blocks: {
                    nx: 10,
                    ny: 10,
                    nz: 10
                }
                ```
                then i_max, j_max, and k_max must all be `>=` 0 and `<=` 9.
                If using model aligned coordinates, that is, rotated by the same scheme as the block model, centroids that are
                encapsulated by the bounding box will be selected. A side effect of this behaviour is a bounding box with x, y, z
                min-max can exceed the model along any axis.

        columns:
          items:
            type: string
          type: array
          title: Columns
          description: |

            List of columns, in addition to the "geometry" columns, that will be included in the output file.
            The `columns` field supports selecting columns by either their title or ID, and can also include a wildcard (`"*"`) placeholder, which will expand to all user columns, ordered alphabetically by title in a case-insensitive manner.
            Please note that the wildcard does not cover the system column `version_id`. To include `version_id` in the output file, it must also be explicitly specified in the `columns` field alongside the wildcard.
            The order of columns in the output file will match the order in the `columns` field. Columns that are part of the initial "geometry" columns will be ignored if specified.
          examples:
            - - '*'
        geometry_columns:
          $ref: '#/components/schemas/GeometryColumns'
          description: |

            Determines whether the blocks in the output file will be primarily identified by their coordinates or their block
            indices.

            If `geometry_columns` is set to "indices" (the default), then the first columns in the output file will be `i`, `j`, `k` followed by the sub-block index columns (if applicable).
            If `geometry_columns` is set to "coordinates", then the output file will contain the columns `x`, `y`, `z` for regular block models and `x`, `y`, `z`, `dx`, `dy`, `dz` for sub-blocked block models. These columns are referred to as the "geometry" columns, and will appear before any others columns specified in the `columns` field.
          default: indices
        groups:
          anyOf:
            - items:
                $ref: '#/components/schemas/QueryGroupSelection'
              type: array
            - type: 'null'
          title: Groups
          description: |

            List of group-scoped column selections, applied in addition to the top-level `columns` field.
            Each entry identifies a single group by either its `group_uuid` or its `title` (a qualified group path using the request's `qualified_title_separator`), and lists the `columns` to select from within that group.
            Columns within a group entry may be referenced by their `col_id` or by their bare title (resolved within the group's namespace). A wildcard (`"*"`) selects the group's direct member columns only, and does not descend into nested groups.
            A group entry returns its columns regardless of the group's `is_hidden` flag. The final column set of the query is the union of the top-level `columns` selection and all `groups` selections.
        include_hidden:
          type: boolean
          title: Include Hidden
          description: When true, the wildcard (`"*"`) expansion also includes columns in hidden groups (groups with `is_hidden = true`) and their descendants. Defaults to false, so hidden groups' columns are excluded from `"*"`. Explicitly named columns are unaffected by this flag.
          default: false
        output_options:
          anyOf:
            - oneOf:
                - $ref: '#/components/schemas/OutputOptionsParquet'
                - $ref: '#/components/schemas/OutputOptionsCSV'
              discriminator:
                propertyName: file_format
                mapping:
                  csv: '#/components/schemas/OutputOptionsCSV'
                  parquet: '#/components/schemas/OutputOptionsParquet'
            - type: 'null'
          title: Output Options
          description: Format of the output file
        qualified_title_separator:
          type: string
          maxLength: 1
          minLength: 1
          title: Qualified Title Separator
          description: Single-character separator used to parse qualified group paths and column titles, and to render returned column headers for this request. The character must not be present in any group or column title in the relevant version. If not provided, the default separator `▸` is used.
          default: ▸
        version_uuid:
          anyOf:
            - type: string
              format: uuid
            - type: 'null'
          title: Version Uuid
          description: Version UUID of the version of the block model to query, or the latest version if not provided
      additionalProperties: false
      type: object
      required:
        - columns
      title: QueryCriteria
