            The `columns` field supports selecting columns by either their title or ID, and can also include a wildcard (`"*"`) placeholder, which will expand to all user columns, ordered alphabetically by title in a case-insensitive manner.
            Please note that the wildcard does not cover the system column `version_id`. To include `version_id` in the output file, it must also be explicitly specified in the `columns` field alongside the wildcard.
            The order of columns in the output file will match the order in the `columns` field. Columns that are part of the initial "geometry" columns will be ignored if specified.
        job_url:
          $ref: '#/components/schemas/URLStr'
          description: Pollable job URL for this query
        mapping:
          $ref: '#/components/schemas/ReadMapping'
          description: |

            List of columns, in addition to the "geometry" columns, that will be included in the output file.
            The `columns` field supports selecting columns by either their title or ID, and can also include a wildcard (`"*"`) placeholder, which will expand to all user columns, ordered alphabetically by title in a case-insensitive manner.
            Please note that the wildcard does not cover the system column `version_id`. To include `version_id` in the output file, it must also be explicitly specified in the `columns` field alongside the wildcard.
            The order of columns in the output file will match the order in the `columns` field. Columns that are part of the initial "geometry" columns will be ignored if specified.
        version_id:
          type: integer
          title: Version Id
          description: |-
            Identifier for the version within a block model as a monotonically increasing integer, where 1 is
            the `version_id` for the version created upon creation of the block model.
          examples:
            - 5
        version_uuid:
          type: string
          format: uuid
          title: Version Uuid
          description: A universally unique identifier for the version
          examples:
            - 3e9ce8de-f6ba-4920-8c6e-0882e90f0ed7
      additionalProperties: false
      type: object
      required:
        - bbox
        - bm_uuid
        - columns
        - job_url
        - mapping
        - version_id
        - version_uuid
      title: QueryResult
    ReadColumn:
      properties:
        col_id:
          type: string
          title: Col Id
          description: The ID of the column, a UUID for non-system columns
          examples:
            - 618d6339-2fa7-4dfd-9c7f-c0b12016639e
        data_type:
          $ref: '#/components/schemas/DataType'
        group:
          anyOf:
            - type: string
            - type: 'null'
          title: Group
          description: 'Qualified path of the group this column belongs to: a bare title for a top-level group, or segments joined by the response separator for a nested group. The separator is the request''s `qualified_title_separator` where supported, defaulting to `▸`. Null means ungrouped.'
        group_uuid:
          anyOf:
            - type: string
              format: uuid
            - type: 'null'
          title: Group Uuid
          description: UUID of the group this column belongs to. Null means ungrouped.
        tags:
          anyOf:
            - additionalProperties: true
              type: object
            - type: 'null'
          title: Tags
          description: 'Publisher-supplied free-form metadata for the column, as a JSON object. Keys must be 1-100 chars and cannot contain leading whitespace or dot, or the characters `/ \ : > < | ? " *`; keys are unique case-insensitively. Values may be any JSON-compatible type. A single `tags` object serialised as UTF-8 JSON must be at most 10 KiB.'
        title:
          type: string
          title: Title
          description: The human-readable label used to identify the column
        unit_id:
          anyOf:
            - type: string
            - type: 'null'
          title: Unit Id
          description: The ID of the column's unit
      additionalProperties: false
      type: object
      required:
        - col_id
        - data_type
        - title
      title: ReadColumn
      description: Column representation for read responses with its derived group path.
    ReadGroup:
      properties:
        group_uuid:
          type: string
          format: uuid
          title: Group Uuid
          description: Unique identifier for the group.
          examples:
            - 00633b08-165b-4dcb-bbae-0d3befa74c7e
        is_hidden:
          type: boolean
          title: Is Hidden
          description: When true, the group's direct member columns are excluded from wildcard queries unless include_hidden is set.
          default: false
        missing_column_policy:
          anyOf:
            - $ref: '#/components/schemas/MissingColumnPolicy'
            - type: 'null'
          description: Policy for columns in this group's zone that are absent from an update. Defaults to INHERIT, which adopts the nearest ancestor's explicit policy zone (USE_PREVIOUS at the root).
        parent_group_uuid:
          anyOf:
            - type: string
              format: uuid
            - type: 'null'
          title: Parent Group Uuid
          description: UUID of the parent group within the same block model. Null means top-level.
        resolved_missing_column_policy:
          $ref: '#/components/schemas/MissingColumnPolicy'
          description: Effective missing-column policy after resolving against the stored parent chain. A group with INHERIT (or no policy) adopts the nearest ancestor's explicit policy zone, defaulting to USE_PREVIOUS when no ancestor sets one.
        tags:
          anyOf:
            - additionalProperties: true
              type: object
            - type: 'null'
          title: Tags
          description: 'Publisher-supplied free-form metadata for the group, as a JSON object. Keys must be 1-100 chars and cannot contain leading whitespace or dot, or the characters `/ \ : > < | ? " *`; keys are unique case-insensitively. Values may be any JSON-compatible type. A single `tags` object serialised as UTF-8 JSON must be at most 10 KiB.'
        title:
          type: string
          title: Title
          description: 'Human-readable label for the group, unique across the parent group, or across top-level groups if no parent. They must be 1-100 chars and cannot contain leading whitespace or dot, or the characters `/ \ : > < | ? " *`. Must not contain the qualified title separator `▸`.'
      additionalProperties: false
      type: object
      required:
