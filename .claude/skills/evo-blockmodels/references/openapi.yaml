          anyOf:
            - $ref: '#/components/schemas/URLStr'
            - type: 'null'
        version_uuid:
          type: string
          format: uuid
          title: Version Uuid
      additionalProperties: false
      type: object
      required:
        - changes
        - job_url
        - job_uuid
        - version_uuid
      title: UpdateWithUrl
    UpdatedResponse:
      properties:
