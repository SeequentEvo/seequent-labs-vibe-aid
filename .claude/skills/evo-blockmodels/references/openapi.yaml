    JobErrorPayload:
      properties:
        detail:
          type: string
          title: Detail
          description: A human-readable explanation specific to this occurrence of the problem.
          examples:
            - Update file 38e3ca486b3b477db0f99646b0529746 not found.
        download_url:
          anyOf:
            - $ref: '#/components/schemas/URLStr'
            - type: 'null'
          description: URL for downloading an errors block model file. Set if the job is for block model update and there were block-specific errors.
        status:
          type: integer
          title: Status
          description: Status code for the error, equivalent to a HTTP status code.
          examples:
            - 400
        title:
          type: string
          title: Title
          description: A short, human-readable summary of the problem type.
          examples:
            - Error in Update
        type:
          type: string
          title: Type
          description: A URI reference that is the primary identifier of the problem type.
          examples:
            - https://seequent.com/error-codes/block-model-service/job/update-error
