    ValidationErrorResponse:
      properties:
        detail:
          type: string
          title: Detail
          description: A human-readable explanation specific to this occurrence of the problem.
          examples:
            - |-
              1 validation error for 'HTTP Request'
              body -> block_rotation
                value is not a valid list (type=type_error.list)
        status:
          type: integer
          title: Status
          description: The HTTP status code generated by the origin server for this occurrence of the problem.
          examples:
            - 422
        title:
          type: string
          title: Title
          description: A short, human-readable summary of the problem type.
          examples:
            - 1 validation error for Request
        type:
          type: string
          title: Type
          description: A URI reference that is the primary identifier of the problem type.
          examples:
            - https://seequent.com/error-codes/block-model-service/validation
      type: object
      required:
        - detail
        - status
        - title
        - type
      title: ValidationErrorResponse
    Version:
      properties:
        base_version_id:
          anyOf:
            - type: integer
            - type: 'null'
          title: Base Version Id
          description: |-
            Version the update was applied to. This will be the same as `parent_version_id`, except for
            updates made by Leapfrog, where it is the current local version when the block model is published. This is null if this
            is the first version.
          examples:
            - 4
        bbox:
          anyOf:
            - $ref: '#/components/schemas/BBox'
            - type: 'null'
          description: |

            Bounding box of data updated between this version and last version. Will be None for the initial version, and updates
            that only delete and rename columns.
        bm_uuid:
          type: string
          format: uuid
          title: Bm Uuid
          description: ID of the block model
          examples:
            - e3c277c2-edc6-4a7a-8380-251dd19231f2
        comment:
          type: string
          title: Comment
          description: User-supplied comment
          default: ''
        created_at:
          type: string
          format: date-time
          title: Created At
          description: When the version was created
        created_by:
          $ref: '#/components/schemas/IMSUserInfo'
          description: User who performed the action that created the version
        geoscience_version_id:
          anyOf:
            - type: string
            - type: 'null'
          title: Geoscience Version Id
          description: ID of the Geoscience Object Service object version associated with this block model version
          examples:
            - '1234567890'
        mapping:
          $ref: '#/components/schemas/ReadMapping'
          description: Columns within this version
        parent_version_id:
          anyOf:
            - type: integer
            - type: 'null'
          title: Parent Version Id
          description: Previous version. 0 if this is the first version.
          examples:
            - 4
        version_id:
          type: integer
          title: Version Id
          description: |-
            Identifier for the version within a block model as a monotonically increasing integer, where 1 is
            the `version_id` for the version created upon creation of the block model.
          examples:
            - 5
        version_uuid:
          type: string
          format: uuid
          title: Version Uuid
          description: A universally unique identifier for the version
          examples:
            - 3e9ce8de-f6ba-4920-8c6e-0882e90f0ed7
      additionalProperties: false
      type: object
      required:
        - bm_uuid
        - created_at
        - created_by
        - mapping
        - version_id
        - version_uuid
      title: Version
      description: API output
    VersionChanges:
      properties:
        blocks_uploaded:
          anyOf:
            - type: integer
            - type: 'null'
          title: Blocks Uploaded
        columns:
          $ref: '#/components/schemas/VersionColumnChanges'
        group_changes:
          $ref: '#/components/schemas/VersionGroupChanges'
        total_blocks:
          type: integer
          title: Total Blocks
        update_type:
          anyOf:
            - $ref: '#/components/schemas/UpdateType'
            - type: 'null'
          description: |

            Behaviour of the update, for blocks that are omitted from the update file.
            - If set to `replace`, the values for blocks that are omitted will be set to null, for the selected columns. If `geometry_change` is true, the geometry of any parent block that has no blocks in the update file will be reset to an un-subdivided state.
            - If set to `merge`, blocks that are omitted will be left unchanged, the values within those blocks will be the same as within the previous version.

            This is null if there were no columns updated and `geometry_change` was not set to false.
      additionalProperties: false
      type: object
      required:
        - columns
        - total_blocks
      title: VersionChanges
