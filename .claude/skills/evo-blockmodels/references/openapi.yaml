    ReportCellStatus:
      type: string
      enum:
        - OK
        - PERCENT_CHANGE_FROM_ZERO
        - NO_DATA
        - INVALID
      title: ReportCellStatus
      description: |-
        Status of a single report cell, describing how its value should be interpreted.

        * `OK`: the value was calculated normally and can be used as-is.
        * `PERCENT_CHANGE_FROM_ZERO`: the percentage change is undefined because the 'from' value was zero. Only used in comparisons.
        * `NO_DATA`: no data was available to calculate the value.
        * `INVALID`: the value could not be calculated because the underlying data contained an invalid value.
