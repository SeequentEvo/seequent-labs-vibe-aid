    UpdateDataLite:
      anyOf:
        - required:
            - columns
        - required:
            - groups
      properties:
        columns:
          $ref: '#/components/schemas/UpdateColumnsLite'
        comment:
          anyOf:
            - type: string
              maxLength: 250
            - type: 'null'
          title: Comment
        fill_subblocks:
          anyOf:
            - type: boolean
            - type: 'null'
          title: Fill Subblocks
          description: |

            If set to true, any missing sub-blocks will be filled with data from the parent block.
            This is only available for fully sub-blocked models, when `update_type` is `merge`, and `geometry_change` is `true`.
        geometry_change:
          anyOf:
            - type: boolean
            - type: 'null'
          title: Geometry Change
          description: |

            Whether the update will create or destroy sub-blocks. Only sub-blocked models may set this to `true`.
            - If omitted, `null`, or set to `false`, no sub-blocks can be created nor destroyed, only sub-blocks that
              exist in the latest version can be updated. `null` and `false` are treated identically, for all model types.
            - If set to `true`:
                - New sub-blocks can be created and/or existing sub-blocks can be destroyed, but all columns must be provided.
                - Only `new`, `update`, and `delete` column operations are allowed as standalone operations.
                - `update_metadata` is allowed, but only when the target columns are being updated as part of the `update` operation, and only when there are no columns being renamed.
                - If `update_type` is set to `merge`, then all sub-blocks within a parent block must be provided.
        group_missing_column_override:
          anyOf:
            - additionalProperties:
                type: string
                const: USE_PREVIOUS
              type: object
            - type: 'null'
          title: Group Missing Column Override
          description: |

            Per-request override of the resolved missing-column policy for specific groups, keyed by qualified
            group title. The override is local-only: it replaces the named group's own resolved policy
            for this request only, and does not affect other groups in the same zone (the overridden group's columns are
            excluded from the zone).
        groups:
          anyOf:
            - $ref: '#/components/schemas/UpdateGroupsLite'
            - type: 'null'
          description: Group operations for this update.
        input_options:
          anyOf:
            - oneOf:
                - $ref: '#/components/schemas/InputOptionsParquet'
                - $ref: '#/components/schemas/InputOptionsCSV'
                - $ref: '#/components/schemas/InputOptionsDatamine'
              discriminator:
                propertyName: file_format
                mapping:
                  csv: '#/components/schemas/InputOptionsCSV'
                  datamine: '#/components/schemas/InputOptionsDatamine'
                  parquet: '#/components/schemas/InputOptionsParquet'
            - type: 'null'
          title: Input Options
        lineage:
          anyOf:
            - $ref: '#/components/schemas/Lineage_V1_0_0'
            - type: 'null'
          description: Lineage of the block model update
          deprecated: true
        qualified_title_separator:
          type: string
          maxLength: 1
          minLength: 1
          title: Qualified Title Separator
          description: Single-character separator used to parse qualified group paths and column titles for this request.The character must not be present in any group or column title in the relevant version. If not provided, the default separator `▸` is used.
          default: ▸
        update_type:
          $ref: '#/components/schemas/UpdateType'
          description: |

            Behaviour of the update, for blocks that are omitted from the update file.
            - If set to `replace`, the values for blocks that are omitted will be set to null, for the selected columns. If `geometry_change` is true, the geometry of any parent block that has no blocks in the update file will be reset to an un-subdivided state.
            - If set to `merge`, blocks that are omitted will be left unchanged, the values within those blocks will be the same as within the previous version.
          default: merge
      additionalProperties: false
      type: object
      title: UpdateDataLite
    UpdateDataWithVersion:
      anyOf:
        - required:
            - columns
        - required:
            - groups
      properties:
        base_version_uuid:
          type: string
          format: uuid
          title: Base Version Uuid
        bbox:
          anyOf:
            - oneOf:
                - $ref: '#/components/schemas/BBox'
                - $ref: '#/components/schemas/BBoxXYZ'
            - type: 'null'
          title: Bbox
        columns:
          $ref: '#/components/schemas/UpdateColumns'
        comment:
          anyOf:
            - type: string
              maxLength: 250
            - type: 'null'
          title: Comment
        fill_subblocks:
          anyOf:
            - type: boolean
            - type: 'null'
          title: Fill Subblocks
          description: |

            If set to true, any missing sub-blocks will be filled with data from the parent block.
            This is only available for fully sub-blocked models, when `update_type` is `merge`, and `geometry_change` is `true`.
        geometry_change:
          anyOf:
            - type: boolean
            - type: 'null'
          title: Geometry Change
          description: |

            Whether the update will create or destroy sub-blocks. Only sub-blocked models may set this to `true`.
            - If omitted, `null`, or set to `false`, no sub-blocks can be created nor destroyed, only sub-blocks that
              exist in the latest version can be updated. `null` and `false` are treated identically, for all model types.
            - If set to `true`:
                - New sub-blocks can be created and/or existing sub-blocks can be destroyed, but all columns must be provided.
                - Only `new`, `update`, and `delete` column operations are allowed as standalone operations.
                - `update_metadata` is allowed, but only when the target columns are being updated as part of the `update` operation, and only when there are no columns being renamed.
                - If `update_type` is set to `merge`, then all sub-blocks within a parent block must be provided.
        group_missing_column_override:
          anyOf:
            - additionalProperties:
                type: string
                const: USE_PREVIOUS
              propertyNames:
                format: uuid
              type: object
            - type: 'null'
          title: Group Missing Column Override
          description: |

            Per-request override of the resolved missing-column policy for specific groups, keyed by group UUID.
            The override is local-only: it replaces the named group's own resolved policy for this request only, and
            does not affect other groups in the same zone (the overridden group's columns are excluded from the zone).
        groups:
          anyOf:
            - $ref: '#/components/schemas/UpdateGroups'
            - type: 'null'
          description: Group operations for this update.
        lineage:
          anyOf:
            - $ref: '#/components/schemas/Lineage_V1_0_0'
            - type: 'null'
          description: Lineage of the block model update
          deprecated: true
        update_type:
          $ref: '#/components/schemas/UpdateType'
          description: |

            Behaviour of the update, for blocks that are omitted from the update file.
            - If set to `replace`, the values for blocks that are omitted will be set to null, for the selected columns. If `geometry_change` is true, the geometry of any parent block that has no blocks in the update file will be reset to an un-subdivided state.
            - If set to `merge`, blocks that are omitted will be left unchanged, the values within those blocks will be the same as within the previous version.
          default: merge
      additionalProperties: false
      type: object
      required:
        - base_version_uuid
