        is_hidden:
          type: boolean
          title: Is Hidden
          description: When true, the group's direct member columns are excluded from wildcard queries unless include_hidden is set.
          default: false
        missing_column_policy:
          anyOf:
            - $ref: '#/components/schemas/MissingColumnPolicy'
            - type: 'null'
          description: Policy for columns in this group's zone that are absent from an update. Defaults to INHERIT, which adopts the nearest ancestor's explicit policy zone (USE_PREVIOUS at the root).
          default: INHERIT
        parent_group:
          anyOf:
            - type: string
            - type: 'null'
          title: Parent Group
          description: 'Qualified path of the parent group within the same block model: a bare title when the parent is a top-level group, or segments joined by `▸` when the parent is itself nested. Null means top-level.'
        tags:
          anyOf:
            - additionalProperties: true
              type: object
            - type: 'null'
          title: Tags
          description: 'Publisher-supplied free-form metadata for the group, as a JSON object. Keys must be 1-100 chars and cannot contain leading whitespace or dot, or the characters `/ \ : > < | ? " *`; keys are unique case-insensitively. Values may be any JSON-compatible type. A single `tags` object serialised as UTF-8 JSON must be at most 10 KiB.'
        title:
          type: string
          title: Title
          description: 'Human-readable label for the group, unique across the parent group, or across top-level groups if no parent. They must be 1-100 chars and cannot contain leading whitespace or dot, or the characters `/ \ : > < | ? " *`. Must not contain the qualified title separator `▸`.'
      additionalProperties: false
      type: object
      required:
        - title
      title: GroupLite
      description: Group metadata using title-based column references (``update_lite`` flow).
    GroupMetadataChange:
      properties:
        from_group:
          type: string
          title: From Group
          description: Qualified path of the group in the parent version's tree.
        group_uuid:
          type: string
          format: uuid
          title: Group Uuid
          description: Stable UUID of the group.
        is_hidden:
          anyOf:
            - type: boolean
            - type: 'null'
          title: Is Hidden
          description: New hidden flag, when it changed.
        missing_column_policy:
          anyOf:
            - $ref: '#/components/schemas/MissingColumnPolicy'
            - type: 'null'
          description: New missing-column policy, when it changed.
        tags:
          anyOf:
            - additionalProperties: true
              type: object
            - type: 'null'
          title: Tags
          description: New tags, when they changed.
        title:
          anyOf:
            - type: string
            - type: 'null'
          title: Title
          description: New title, when the title changed.
        to_group:
          type: string
          title: To Group
          description: Qualified path of the group in the target version's tree.
      additionalProperties: false
      type: object
      required:
        - from_group
        - group_uuid
        - to_group
      title: GroupMetadataChange
      description: |-
        A group-definition metadata change between two versions.

        ``from_group``/``to_group`` are the group's fully qualified paths in the parent and target trees;
        they differ when the group was renamed or re-parented. The remaining fields carry the post-change
        value of any attribute that changed and are null when that attribute was unchanged.
